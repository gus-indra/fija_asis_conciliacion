name: oracle-local

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-21c
    restart: unless-stopped

    environment:
      # Contrasena de administracion de Oracle.
      ORACLE_PASSWORD: "OracleAdmin_2026"

      # Usuario para trabajar desde DBeaver.
      APP_USER: "energy_app"
      APP_USER_PASSWORD: "EnergyApp_2026"

    ports:
      - "127.0.0.1:1521:1521"

    volumes:
      - oracle_data:/opt/oracle/oradata

    shm_size: "1gb"

    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s

volumes:
  oracle_data: